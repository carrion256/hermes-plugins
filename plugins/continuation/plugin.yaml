name: continuation
version: 0.6.0
description: "Evidence-based completion: pre_verify stop gate holds coding turns until the native todo ledger is clear, verification evidence is fresh, and an independent native /review closed on the exact reviewed change; explicit acceptance ledger (declare/bind/status/disposition) binds real native evidence IDs and requires reviewer coverage assessment before clean completion."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - acceptance
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_tool_call_settled
  - pre_verify
  - transform_llm_output
  # on_session_reset/finalize and agent_loop_stopped clear session state;
  # on_session_end deliberately unregistered so a pending reviewer stays bound
  # and reset/finalize/stop bound the new task identity.
  - on_session_reset
  - on_session_finalize
  - agent_loop_stopped
config_schema:
  max_review_rounds:
    type: int
    default: 2
    description: "Bounded review/fix rounds per genuine user turn; exhaustion releases the turn but the final response is labeled blocked/unverified, never silent completion."
  rule_obligations:
    type: bool
    default: true
    description: "Hold pre_verify on acceptance obligations the rules plugin recorded for this session: every check/verification ref a matched rule declared must be covered by a BOUND acceptance declaration (its refs contain the exact ref, or its check identity equals it) before the turn may finish. The hold is a normal blocker — counted in the session record and labeled on the final response, with the exact acceptance declare/bind call in the message. An absent rules plugin means no obligations and no hold; a non-boolean value keeps the safe default (true) with a logged warning."
  friction_after_holds:
    type: int
    default: 3
    description: "Consecutive pre_verify holds carried on the SAME blocker (whitespace-normalised digest) before one gate-friction row is filed with the papercuts sink: kind=repeated_hold, identity=the blocker digest, detail=the redacted blocker bounded to 1k. One row per blocker per session; the per-blocker streak resets when the blocker stops holding the turn or on a genuine new user turn, and is durable in record['friction']. 0 disables reporting entirely; a non-integer or negative value keeps the default (3) with a logged warning. With papercuts absent nothing is filed and acceptance status reports friction.last_reason=friction_unavailable — never a crash."
