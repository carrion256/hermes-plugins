name: auto-answer-classifier
version: 0.5.0
description: "Approved conventional defaults resolve upstream; persistence requires an observed human answer and native consent to remember; repository evidence is hash-bound and secret-redacted; human answers/skips remain authoritative."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - clarification_defaults
provides_hooks:
  - post_tool_call
provides_middleware:
  - tool_execution
config_schema:
  enabled:
    type: bool
    default: true
    description: "Resolve approved conventional questions before clarify and apply hash-backed defaults only on genuine timeouts; multi-question legacy ambiguity remains advisory."
  dry_run:
    type: bool
    default: false
    description: "Recommend defaults without applying them or claiming a human answer."
  endpoint:
    type: str
    default: "http://192.168.50.71:8787"
    description: "Classifier service base URL."
  api_key_env:
    type: str
    default: "CLASSIFIER_API_KEY"
    description: "Bearer-key environment variable name; never a credential value."
  min_sound_default:
    type: float
    default: 0.8
    description: "Minimum P(the default is sound) from the classifier before any ranking counts. Measured on the deployed engine (2026-10-27, 6 labelled cases): conventional defaults scored 0.988-0.9995 while product/authority/security decisions scored 0.050-0.055, so the gate sits in a wide gap -- 0.8 keeps a 5x margin under every legitimate default observed and still rejects an authority question outright. 0.5 is the old yes/no argmax; lower it only if legitimate defaults start abstaining."
  min_pick_confidence:
    type: float
    default: 0.0
    description: "Minimum confidence the classifier reports for the picked option; 0.0 accepts every ranking, as before. Ambiguity does NOT show up here: cases with balanced evidence still scored 0.79-0.90, so raising this abstains on decisive-but-unwanted picks rather than on genuine ties. Prefer min_sound_default."
  min_pick_margin:
    type: float
    default: 0.0
    description: "Minimum probability margin between the top option and the runner-up; 0.0 accepts a near-tie, as before. Same caveat as the confidence floor: measured margins were 0.79-0.997 even when the evidence was balanced, so this mostly measures how sharply the classifier prefers its pick, not whether the question is decidable."
