name: auto-answer-classifier
version: 0.5.0
description: "Approved conventional defaults resolve upstream; persistence requires an observed human answer and native consent to remember; repository evidence is hash-bound and secret-redacted; human answers/skips remain authoritative."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - clarification_defaults
provides_hooks:
  - post_tool_call
provides_middleware:
  - tool_execution
config_schema:
  enabled:
    type: bool
    default: true
    description: "Resolve approved conventional questions before clarify and apply hash-backed defaults only on genuine timeouts; multi-question legacy ambiguity remains advisory."
  dry_run:
    type: bool
    default: false
    description: "Recommend defaults without applying them or claiming a human answer."
  endpoint:
    type: str
    default: "http://192.168.50.71:8787"
    description: "Classifier service base URL."
  api_key_env:
    type: str
    default: "CLASSIFIER_API_KEY"
    description: "Bearer-key environment variable name; never a credential value."
  min_sound_default:
    type: float
    default: 0.5
    description: "Minimum P(the default is sound) from the classifier before any ranking counts; 0.5 is the old yes/no argmax. Raise it (e.g. 0.8) when recommendations keep landing on questions that are really product, authority, or security decisions."
  min_pick_confidence:
    type: float
    default: 0.0
    description: "Minimum confidence the classifier reports for the picked option; 0.0 accepts every ranking, as before. Raise it when low-confidence picks keep contradicting the human answers that follow."
  min_pick_margin:
    type: float
    default: 0.0
    description: "Minimum probability margin between the top option and the runner-up; 0.0 accepts a near-tie, as before. Raise it when the same question flips between options across runs, which means the evidence does not actually decide it."
