name: prewalk
version: 0.3.1
description: "One-way model handoff: strong model plans, cheap model executes from the first planned, successful edit/write (native live switch; reset is explicit)."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - prewalk_arm
  - prewalk_status
  - prewalk_reset
provides_hooks:
  - post_tool_call
  - pre_llm_call
  - subagent_start
  - on_session_reset
  - on_session_finalize
config_schema:
  target_model:
    type: str
    default: ""
    description: "Cheap/execution model id (must be served by the same provider/endpoint as the planning model)."
  plan_nudge:
    type: bool
    default: true
    description: "Inject the planning nudge once (same turn) when prewalk arms."
  child_prewalk:
    type: bool
    default: true
    description: "Armed planning lane is inherited by delegated child sessions (OMP bundled-task parity)."
  todo_gate:
    type: bool
    default: true
    description: "Switching requires observing a non-empty todo_list plan first (observational gate)."
