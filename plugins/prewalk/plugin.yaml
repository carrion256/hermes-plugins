name: prewalk
version: 0.1.0
description: "One-way model handoff: strong model plans, cheap model executes from the first successful edit/write."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - prewalk_arm
provides_hooks:
  - post_tool_call
  - pre_llm_call
provides_middleware:
  - llm_request
config_schema:
  target_model:
    type: str
    default: ""
    description: "Cheap/execution model id (must be served by the same provider/endpoint as the planning model)."
  plan_nudge:
    type: bool
    default: true
    description: "Inject the planning nudge once when prewalk arms."
