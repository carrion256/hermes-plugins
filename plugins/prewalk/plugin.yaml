name: prewalk
version: 0.7.0
description: "One-way model handoff: strong model plans, validated evidence-backed handoff switches to the cheap execution model via the native live switch or the host cross-provider switch seam. Top-level sessions switch ONLY via prewalk_ready; delegated children on the task lane hand off automatically on their first completed tool call, mid-turn (never retried). No implicit first-write switch; optional bounded operator-enabled replan back to the original model AND provider."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - prewalk_arm
  - prewalk_status
  - prewalk_reset
  - prewalk_ready
  - prewalk_replan
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - subagent_start
  - on_session_reset
  - on_session_finalize
config_schema:
  target_model:
    type: str
    default: ""
    description: "Cheap/execution model id. When unset, the host route for the 'executor' role (PluginContext.resolve_role_model) supplies the target; with neither configured, prewalk refuses to arm. If the target provider is set (or routed) to a provider other than the planner's own, the destination is validated at arm time and the handoff goes through the host cross-provider switch seam; with the seam absent, cross-provider targets are refused at arm with the provider named. Same-provider targets use the native live switch unchanged."
  target_provider:
    type: str
    default: ""
    description: "Optional provider for the handoff target (empty = the planner's current provider/endpoint). Cross-provider targets require the host PluginContext.switch_agent_model seam and are dry-run validated at arm; replan then restores the original model AND provider."
  plan_nudge:
    type: bool
    default: true
    description: "Inject the planning nudge once (same turn) when prewalk arms."
  child_prewalk:
    type: bool
    default: true
    description: "Armed planning lane is inherited by delegated child sessions (OMP bundled-task parity). Master switch; see child_prewalk_roles for which routing roles inherit it. Child-lane handoff is AUTOMATIC: no prewalk_ready and no todo gate; on the child's first completed post_tool_call the child switches to the target model once, mid-turn, before its next model call (a failed switch is logged at warning level and never retried — the child continues on its current model). Top-level sessions still require prewalk_ready validation to switch."
  child_prewalk_roles:
    type: list
    default: ["task"]
    description: "Routing roles whose delegated children inherit the planning lane (host reports the child's effective routing role in the subagent_start child_model_role field). A child that requested NO role (plain delegation) always arms, as in OMP; any other role (e.g. scout, reviewer, architect) arms nothing. Set to a list of role names to extend the lane."
  todo_gate:
    type: bool
    default: true
    description: "prewalk_ready requires a non-empty native todo plan (real agent._todo_store) before it may switch."
  replan_enabled:
    type: bool
    default: false
    description: "Operator opt-in: one bounded prewalk_replan per session back to the ORIGINAL model, only with a concrete failed assumption/check. Default off; the handoff itself never oscillates."
