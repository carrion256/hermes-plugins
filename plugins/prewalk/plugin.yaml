name: prewalk
version: 0.5.0
description: "One-way model handoff driven ONLY by prewalk_ready: strong model plans, validated evidence-backed handoff switches to the cheap execution model via the native live switch (no implicit first-write switch; optional bounded operator-enabled replan back to the original model)."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - prewalk_arm
  - prewalk_status
  - prewalk_reset
  - prewalk_ready
  - prewalk_replan
provides_hooks:
  - pre_llm_call
  - subagent_start
  - on_session_reset
  - on_session_finalize
config_schema:
  target_model:
    type: str
    default: ""
    description: "Cheap/execution model id (must be served by the same provider/endpoint as the planning model)."
  plan_nudge:
    type: bool
    default: true
    description: "Inject the planning nudge once (same turn) when prewalk arms."
  child_prewalk:
    type: bool
    default: true
    description: "Armed planning lane is inherited by delegated child sessions (OMP bundled-task parity)."
  todo_gate:
    type: bool
    default: true
    description: "prewalk_ready requires a non-empty native todo plan (real agent._todo_store) before it may switch."
  replan_enabled:
    type: bool
    default: false
    description: "Operator opt-in: one bounded prewalk_replan per session back to the ORIGINAL model, only with a concrete failed assumption/check. Default off; the handoff itself never oscillates."
