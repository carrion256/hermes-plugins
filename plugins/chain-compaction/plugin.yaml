name: chain-compaction
version: 0.2.0
description: "Ordered compaction cascade: runs configured methods in sequence (classifier prune, tool-output clip, stale-pair drop), advancing to the next whenever a stage fails or under-delivers, stopping when the cumulative reduction is substantial enough, and always falling back to the untouched built-in summary."
author: "hermes-plugins (cascade design; reuses the fast-compaction pruner)"
manifest_version: 2
api_version: 1
provides_tools:
  - chain_compaction_status
provides_hooks: []
config_schema:
  enabled:
    type: bool
    default: true
    description: "When false the engine defers every compression to the built-in summary path."
  pipeline:
    type: string
    default: "prune,clip,drop_stale"
    description: "Comma-separated ordered stage names from: prune (classifier keep/drop via fast-compaction), clip (head+tail truncation of oversized tool results), drop_stale (positional removal of old tool pairs), summary (the normal compaction engine itself). Without summary the cascade commits verbatim output and the built-in only runs as the under-delivery backstop — one or the other, never both. With summary last (for example \"prune,summary\") they compose: the earlier stages reduce, the built-in then summarises what survived, and no earlier stage may commit early and skip it."
  target_reduction:
    type: float
    default: 0.25
    description: "Cumulative reduction (of the original request size) at which the cascade stops early and commits verbatim output."
  stage_min_reduction:
    type: float
    default: 0.05
    description: "Minimum reduction a single stage must produce on its own; below it the stage counts as 'not substantial enough' and the next one runs."
  endpoint:
    type: string
    default: "http://192.168.50.71:8787"
    description: "Classifier base URL (prune stage only). Never log or echo the key."
  api_key_env:
    type: string
    default: "CLASSIFIER_API_KEY"
    description: "Environment variable holding the classifier bearer key."
  request_timeout:
    type: float
    default: 20.0
    description: "Seconds per classifier request."
  preserve_recent_messages:
    type: int
    default: 6
    description: "Newest messages never touched by any stage (shared across prune/drop_stale/clip)."
  clip_head_chars:
    type: int
    default: 1200
    description: "clip stage: chars kept from each end of an oversized tool result."
  clip_trigger_chars:
    type: int
    default: 8000
    description: "clip stage: only results longer than this are truncated."
  drop_stale_keep_pairs:
    type: int
    default: 4
    description: "drop_stale stage: the N most recent tool call/result pairs are kept regardless."
  drop_confidence:
    type: float
    default: 0.5
    description: "prune stage: P(drop) at which a tool call or result is deleted. 0.5 is plain argmax -- exactly what the service's keep/drop choice says, the previous behaviour. Raising it (e.g. 0.9) demands strong evidence before context is deleted, so a pair the service only weakly favours dropping survives. Clamped 0-1; an answer with no probabilities falls back to the choice itself."
  prune_defaults:
    type: object
    default: {}
    description: "Overrides forwarded to the fast-compaction pruner (max_state_tokens, max_request_tokens, truncate_head_chars, drop_confidence). A key set here wins over this plugin's own setting for that key."
  proactive_prune_mode:
    type: string
    default: "off"
    description: "Mid-session eviction on the host's proactive seam (runs when the request exceeds the trigger, below the compression threshold). off = host's deterministic passes; fifo = drop oldest unpinned tool pairs with no classifier call; classifier = prune-stage keep/drop pass first, degrading to fifo per-turn on any classifier fault. Requires fast-compaction installed."
  proactive_trigger_tokens:
    type: int
    default: 8000
    description: "Estimated tokens of context at which proactive eviction runs (used only when compression.proactive_prune_tokens is 0). 0 disables."
  proactive_target_tokens:
    type: int
    default: 2000
    description: "Approximate tokens to reclaim per proactive pass; the greedy FIFO stops when reached. The host's reclaim floor and regrowth runway still gate the commit."
