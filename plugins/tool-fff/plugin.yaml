name: tool-fff
version: 0.1.0
description: "fff-backed search: registers fff_search (fff binary when configured, ripgrep fallback). Optional opt-in override of built-in search_files."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
capabilities:
  - tools.override
provides_tools:
  - fff_search
external_dependencies:
  - "fff binary (optional — falls back to ripgrep when absent)"
config_schema:
  binary:
    type: str
    default: ""
    description: "fff executable (empty = auto-detect on PATH; fall back to ripgrep if absent)."
  override_search_files:
    type: bool
    default: false
    description: "Register fff_search as an override of built-in search_files (requires plugins.entries.tool-fff.allow_tool_override: true)."
