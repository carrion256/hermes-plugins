name: tool-fff
version: 0.1.0
description: "Native-Hermes search adapter: optional override of built-in search_files delegating to the native handler (schema, task CWD/backend, credential redaction, pagination bounds preserved). No fff acceleration exists."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
capabilities:
  - tools.override
external_dependencies: []
config_schema:
  override_search_files:
    type: bool
    default: false
    description: "Register the search_files override delegating to the native handler (requires plugins.entries.tool-fff.allow_tool_override: true)."
