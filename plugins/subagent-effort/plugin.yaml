name: subagent-effort
version: 0.5.3
description: "Classifier-driven reasoning-effort evaluation for delegated subagents. PURE SHADOW by design: records verdicts, observed child origin, native-normalized recommendations and outcomes in durable ctx.state; never applies effort — every explicit operator/model/tool choice stays untouched. Not a replacement for explicit effort controls: recommendations here never move effort (explicit user intent can, via keyword-steering's magic keywords and the host seam)."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_hooks:
  - subagent_start
  - pre_llm_call
  - post_api_request
  - post_llm_call
  - subagent_stop
config_schema:
  endpoint:
    type: str
    default: "http://192.168.50.149:8787"
    description: "Classifier service base URL."
  api_key_env:
    type: str
    default: "CLASSIFIER_API_KEY"
    description: "Env var holding the Bearer key (name only; value read at call time)."
  low_effort:
    type: str
    default: "low"
    description: "Effort SUGGESTED (recorded only) for tasks classified simple."
  high_effort:
    type: str
    default: "high"
    description: "Effort SUGGESTED (recorded only) for tasks classified complex."
