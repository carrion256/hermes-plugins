name: papercuts
version: 0.1.0
description: "Exposes the local papercuts CLI through Hermes: report/list/ack/resolve/stats without leaving the agent loop."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - papercuts
external_dependencies:
  - "papercuts binary (default: /home/common/projects/papercuts/papercuts)"
config_schema:
  binary:
    type: str
    default: "/home/common/projects/papercuts/papercuts"
    description: "Path to the papercuts CLI binary."
