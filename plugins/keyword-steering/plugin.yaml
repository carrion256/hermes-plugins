name: keyword-steering
version: 0.1.0
description: "Magic-keyword prompt steering: config-driven keyword table injected as context when the user message triggers on a keyword."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_llm_call
config_schema:
  keywords:
    type: dict
    default: {}
    description: "Mapping of trigger keyword -> steering text injected as context when the user message contains it (case-insensitive, whole-word)."
