name: keyword-steering
version: 0.4.0
description: "Explicit steering modes plus OMP-compatible built-in magic keywords: ultrathink, orchestrate, workflow — enabled by default, configurable via magic_keywords, activated per user turn on prose triggers (code, quotes, identifier/path contexts excluded). Config-defined modes reference skill/rule paths or identifiers as consult pointers (their text is never copied); declared conflicts surface and withhold both sides; everything is inspectable via steering_status. ultrathink requests maximum host reasoning effort via PluginContext.set_turn_reasoning('ultra') when the host provides it, degrading to guidance-only (recorded) otherwise. Guidance-only apart from that seam: no messages or tool args are ever rewritten."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - steering_status
provides_hooks:
  - pre_llm_call
  - on_session_reset
  - on_session_finalize
  - agent_loop_stopped
config_schema:
  modes:
    type: dict
    default: {}
    description: "Mapping of mode name -> {refs: [skill/rule path or identifier], triggers: [activation phrases, default: mode name], conflicts_with: [mode names]}. Activated when a trigger appears in genuine prose (fenced code, inline code, quoted text, identifier/path contexts ignored); guidance names the refs as consult pointers (text is never copied). Mutually conflicting modes in one turn are both withheld and the conflict is surfaced. Mode names must not shadow the built-in magic keywords (registration fails loudly); conflicts_with may name them. Legacy 'keywords' prompt-copy config is rejected: migrate each entry to a mode."
  magic_keywords:
    type: dict
    default:
      enabled: true
    description: "Built-in OMP-compatible magic keywords {ultrathink, orchestrate, workflow}, all enabled by default. Mapping of keyword -> boolean, plus optional top-level 'enabled' (default true) applied to every keyword not named explicitly. ultrathink requests maximum reasoning for the turn through the host PluginContext.set_turn_reasoning('ultra') seam and degrades to guidance-only (surfaced in the reminder and steering_status) when the host lacks it; orchestrate steers toward delegation and parallel subagents with batched independent requests; workflow steers toward an explicit plan, then verification, then a closing review. Unknown keyword names or non-boolean values fail registration loudly."
