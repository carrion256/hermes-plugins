name: fast-compaction
version: 0.2.0
description: "Lossless-by-deletion compaction overlay: the classifier service decides which stale tool calls/results to drop or truncate; kept content stays verbatim and the built-in summary remains the fallback."
author: "fast-jev-compaction port (tamaratran/fast-jev-compaction)"
manifest_version: 2
api_version: 1
provides_tools: []
provides_hooks: []
config_schema:
  enabled:
    type: bool
    default: true
    description: "When false the engine defers every compression to the built-in summary path."
  endpoint:
    type: string
    default: "http://192.168.50.71:8787"
    description: "Classifier base URL. Never log or echo the key; set the key in the environment."
  api_key_env:
    type: string
    default: "CLASSIFIER_API_KEY"
    description: "Environment variable holding the Bearer key, read at call time."
  preserve_recent_messages:
    type: int
    default: 6
    description: "Newest messages never touched (the first message is always pinned). Clamped 1-64."
  min_reduction:
    type: float
    default: 0.25
    description: "Minimum estimated-token reduction for the pruned transcript to replace the built-in summary. Below it, fall back."
  max_state_tokens:
    type: int
    default: 20000
    description: "Estimated-token ceiling for the state sent with each request; fitting stages apply before giving up."
  max_request_tokens:
    type: int
    default: 28000
    description: "Estimated ceiling for state plus one batch of questions. Questions batch at 16 calls (two choice questions each, 32 per request) so a compaction sends the state exactly once."
  truncate_head_chars:
    type: int
    default: 300
    description: "Characters of a dropped result retained as a truncated excerpt plus a one-line note. Clamped 0-4000."
  request_timeout:
    type: float
    default: 20.0
    description: "Seconds per classifier request (/v1/systemone); on timeout the whole attempt falls back to the built-in summary."
  drop_confidence:
    type: float
    default: 0.5
    description: "P(drop) at which a tool call or result is deleted. 0.5 is plain argmax: whatever the service's keep/drop choice says, exactly the previous behaviour. Raising it (e.g. 0.9) demands strong evidence before context is deleted, so a pair the service only weakly favours dropping is kept. Clamped 0-1; an answer carrying no probabilities falls back to the choice itself. Measured 2026-10-27: the engine returned P(drop) 0.82-0.99 even for results the task still needed, because the criteria judge reproducibility and relevance from the state alone and re-running a tool is usually possible -- so read 0.5 as aggressive and 0.9 as conservative, not as a calibrated split, and tune from the recorded probabilities."
  proactive_prune_mode:
    type: string
    default: "off"
    description: "Mid-session eviction on the host's proactive seam (runs when the request exceeds the trigger, below the compression threshold). off = host's deterministic passes; fifo = drop oldest unpinned tool pairs with no classifier call; classifier = keep/drop pass first, degrading to fifo per-turn on any classifier fault."
  proactive_trigger_tokens:
    type: int
    default: 8000
    description: "Estimated tokens of context at which proactive eviction runs (used only when compression.proactive_prune_tokens is 0). 0 disables."
  proactive_target_tokens:
    type: int
    default: 2000
    description: "Approximate tokens to reclaim per proactive pass; the greedy FIFO stops when reached. The host's reclaim floor and regrowth runway still gate the commit."
