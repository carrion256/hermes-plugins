name: loop-guard
version: 0.2.0
description: "Result-aware tool loop blocks and next-turn answer reminders; never injects another session's task."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - pre_llm_call
  - on_session_reset
  - on_session_finalize
config_schema:
  tool_call_streak:
    type: int
    default: 5
    description: "Identical calls with identical results before blocking the next retry. Read-only polling is exempt."
  answer_repetition:
    type: int
    default: 3
    description: "Repeated final answers before a targeted reminder on the next genuine turn."
  redirect_cap:
    type: int
    default: 2
    description: "Maximum interventions per detector and live agent; zero disables interventions."
