name: intake
version: 0.3.0
description: "Reusable text intake: extracts actionable follow-ups from arbitrary text with the profile chat model — including due dates (a Due: ISO line, with today's date injected so relative deadlines resolve) — scores each with a deadline-aware urgency label (high/medium/low) via concurrent per-item classifier calls, dedupes state-aware against what is already filed (terminal tasks no longer suppress re-filing; rewordings of filed work are flagged near_dupe on the report instead of silently filed), bounds the whole run with a wall-clock deadline (run_deadline) so a hung store or model call can never strand a piped CLI, and files survivors as Covey meta tasks in the profile's global worklist (the sink for transcript triage and digest pipelines); every filing run appends one JSON line to an append-only decision log."
author: "hermes-plugins"
manifest_version: 2
api_version: 1
provides_tools:
  - intake
provides_hooks: []
config_schema:
  binary:
    type: string
    default: "covey"
    description: "Covey executable name or path, resolved through the host bridge exactly like the covey-tasks plugin."
  db_path:
    type: string
    default: ""
    description: "ABSOLUTE path of the profile's global Covey database. Required; never defaulted. Set it to the SAME path the covey-tasks plugin uses so intake items appear in the user's worklist. An empty or relative path disables the tool with store_unavailable."
  endpoint:
    type: string
    default: "http://127.0.0.1:8102"
    description: "Chat-completions origin used for extraction. The flare node requires the top-level model field; the bearer key is read from the environment at call time and never stored, logged or echoed."
  served_model:
    type: string
    default: "qwen3.8-flash-next"
    description: "Model name sent as the top-level `model` field on every chat-completions request."
  api_key_env:
    type: string
    default: "CLASSIFIER_API_KEY"
    description: "Environment variable holding the bearer key for the chat endpoint. The key is read at call time and never echoed."
  max_chars:
    type: int
    default: 60000
    description: "Head+tail clip applied to the input before extraction; the dropped middle is marked with a stable `[... clipped ...]` marker."
  max_items:
    type: int
    default: 20
    description: "Cap on submitted items per run; extraction stops after this many unique items."
  timeout:
    type: float
    default: 30.0
    description: "Seconds per chat request. The extraction model is a reasoning model and needs headroom."
  classifier_endpoint:
    type: string
    default: ""
    description: "Classifier origin for urgency scoring (POST /v1/systemone typed choice head, same served_model and api_key_env as extraction). Empty = the chat endpoint's node. A dead classifier costs the label, never the intake: items file without an Urgency line."
  classifier_timeout:
    type: float
    default: 1.5
    description: "Seconds per urgency classification. Short by design: urgency decorates intake and must never block it."
  run_deadline:
    type: float
    default: 120.0
    description: "Wall-clock seconds a whole intake run may take, measured from the moment input is handled. The per-stage timeouts never outlive it: a hung store read or model call cannot leave a piped CLI waiting forever. Past the deadline the run stops cleanly — unfiled items report failed with code run_cancelled, unearned labels are simply absent. 0 or negative disables the bound."
  grounding_max:
    type: int
    default: 100
    description: "Cap on how many already-filed items are listed in the extraction prompt's do-not-restate section (most recent first). The paged store read stays exhaustive; 0 disables the listing while dedupe still works."
  decision_log:
    type: string
    default: ""
    description: "Absolute path of the append-only JSONL decision log; empty means the sidecar next to the store (db_path + .intake.jsonl). One JSON line per run that files, matches or fails something — quiet runs log nothing. Unwritable or unencodable writes are skipped silently — logging never blocks intake."
