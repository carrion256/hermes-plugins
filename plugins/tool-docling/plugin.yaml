name: tool-docling
version: 0.2.0
description: "Qualified backend (Python Docling CLI) local document conversion: content-addressed cache, provenance anchors, bounded page/section selection."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - docling_convert
external_dependencies:
  - "docling CLI on PATH (pip: docling; qualified backend, version reported per call)"
config_schema:
  binary:
    type: str
    default: "docling"
    description: "docling executable (on PATH or absolute path)."
