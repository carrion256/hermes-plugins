name: browser-bladebro
version: 0.5.0
description: "bladebro real-browser lane for Hermes: the browser_* tools (names, schemas, result shapes of the pre-removal built-ins) plus browser_run batches and direct-artifact certified browser acceptance (browser_scenario/browser_capture), over per-task bladebro tabs. Separate lane from core browser_exec (CDP/browser-harness); no behavioral coupling."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - browser_navigate
  - browser_snapshot
  - browser_click
  - browser_type
  - browser_scroll
  - browser_back
  - browser_press
  - browser_get_images
  - browser_vision
  - browser_console
  - browser_run
  - browser_scenario
  - browser_capture
provides_hooks:
  - on_session_finalize
  - on_session_reset
  - subagent_stop
external_dependencies:
  - "operator-granted plugins.entries.browser-bladebro.mcp_allowlist containing the bladebro MCP server"
config_schema:
  server:
    type: str
    default: "bladebro"
    description: "MCP server name; access is gated by the operator-granted mcp_allowlist (default deny)."
  timeout:
    type: int
    default: 60
    description: "Per-call MCP timeout in seconds (clamped 1-600 natively)."
  snapshot_threshold:
    type: int
    default: 15000
    description: "Compact browser_snapshot character budget (floor 1000); larger snapshots are truncated at line boundaries with the full text stored for read_file paging."
