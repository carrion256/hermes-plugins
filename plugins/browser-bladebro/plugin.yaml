name: browser-bladebro
version: 0.4.0
description: "bladebro as the drop-in Hermes browser backend: replaces the built-in browser_* tools (same names, schemas, result shapes) with per-task bladebro tabs, plus browser_run batches and direct-artifact certified browser acceptance (browser_scenario/browser_capture)."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - browser_navigate
  - browser_snapshot
  - browser_click
  - browser_type
  - browser_scroll
  - browser_back
  - browser_press
  - browser_get_images
  - browser_vision
  - browser_console
  - browser_run
  - browser_scenario
  - browser_capture
provides_hooks:
  - on_session_finalize
  - on_session_reset
  - subagent_stop
external_dependencies:
  - "operator-granted plugins.entries.browser-bladebro.mcp_allowlist containing the bladebro MCP server"
  - "operator-granted plugins.entries.browser-bladebro.allow_tool_override: true (replaces the built-in browser_* tools)"
config_schema:
  server:
    type: str
    default: "bladebro"
    description: "MCP server name; access is gated by the operator-granted mcp_allowlist (default deny)."
  timeout:
    type: int
    default: 60
    description: "Per-call MCP timeout in seconds (clamped 1-600 natively)."
