name: browser-bladebro
version: 0.3.1
description: "Direct-artifact browser acceptance on the qualified native run shape: pinned source snapshots + bounded confined HTML artifacts, initial/interaction/final flow observed by the native backend, backend see/console observations supplementary, real evidence rows with bound/failed/unbound truth."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_tools:
  - browser_open
  - browser_close
  - browser_run
  - browser_scenario
  - browser_capture
  - browser_screenshot
provides_hooks: []
external_dependencies:
  - "operator-granted plugins.entries.browser-bladebro.mcp_allowlist containing the bladebro MCP server"
config_schema:
  server:
    type: str
    default: "bladebro"
    description: "MCP server name; access is gated by the operator-granted mcp_allowlist (default deny)."
  timeout:
    type: int
    default: 60
    description: "Per-call MCP timeout in seconds (clamped 1-600 natively)."
