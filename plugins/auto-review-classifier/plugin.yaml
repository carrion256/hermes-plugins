name: auto-review-classifier
version: 0.2.0
description: "Advisory risk screen using Hermes's native block/approve directives; mutating process actions are screened. Classifier outages remain fail-open."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_tool_call
config_schema:
  endpoint:
    type: str
    default: "http://192.168.50.149:8787"
    description: "Classifier service base URL (GET /health, POST /classify)."
  api_key_env:
    type: str
    default: "CLASSIFIER_API_KEY"
    description: "Env var holding the Bearer key. Name only — value read at call time, never stored."
  policy:
    type: str
    default: "ask"
    description: "'ask' = require native human approval; 'deny' = block a risky call before execution."
