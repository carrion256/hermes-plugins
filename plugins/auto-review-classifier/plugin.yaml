name: auto-review-classifier
version: 0.5.0
description: "Effect-aware risk screen with native egress redaction, resolved target/backend context, and approval rule keys bound to the exact operation; incomplete safe evidence remains unknown while native permissions stay authoritative."
author: "dsh-plugins port"
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_tool_call
external_dependencies:
  - "sibling plugin classifier-core provides the shared classifier client and its endpoint/served_model/api_key_env settings; without it every call fails open"
config_schema:
  policy:
    type: str
    default: "ask"
    description: "'ask' = require native human approval; 'deny' = block a risky call before execution."
  threshold:
    type: float
    default: 0.5
    description: "P(risky) at or above which the operation needs human review (or blocks under policy deny). The default 0.5 is the argmax of the two-label head this replaced; every decision records its probability so this can be recalibrated. Measured 2026-10-27 on 20 labelled tool calls: benign ones scored 0.0000-0.0039 and destructive ones 0.9996-1.0000, a 250x gap with 0.5 in the middle, so there is nothing to tune here until real traffic shows a case inside the gap."
